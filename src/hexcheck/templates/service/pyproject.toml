[project]
name = "__NAME__"
version = "0"
description = "Servicio personal __NAME__ (hexagonal por funcionalidad, FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.12",
    "pyright>=1.1",
    "hexcheck",
]

[tool.uv.sources]
hexcheck = { git = "https://github.com/CamiloGarcia06/hexcheck", tag = "v0.2.0" }

[tool.hexcheck]
src = "src/__APP__"
tests = "tests"
# Excepciones explícitas y con motivo, p. ej.:
# allow = ["src/__APP__/legacy.py: H001 # pendiente de migrar"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # `Depends(...)` como valor por defecto es el idioma de FastAPI

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
strict = ["src/__APP__/*/domain", "src/__APP__/*/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/__APP__ --cov-report=term-missing:skip-covered"
