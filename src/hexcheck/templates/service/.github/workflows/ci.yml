name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - run: uv sync --frozen
      - run: git config user.email juancasangar@hotmail.com  # `task identity` mira la identidad local
      - run: task check

